version: 2.0.0
tables:
  - id: hub_customer
    conceptual:
      name: Customer Hub
      kind: hub
      description: Business key for all customer entities across source systems.
    logical:
      name: Customer Hub Table
    physical:
      name: hub_customer
    display:
      icon: 👤
    columns:
      - id: customer_hk
        name: Customer Hash Key
        type: String
        isPrimaryKey: true
      - id: customer_bk
        name: Customer ID (BK)
        type: String
      - id: load_dts
        name: Load Date
        type: Timestamp
        additivity: non
      - id: record_source
        name: Record Source
        type: String
    sampleData:
      - - a1b2c3d4
        - CUST-00042
        - crm.salesforce
      - - e5f6g7h8
        - CUST-00018
        - crm.salesforce
      - - i9j0k1l2
        - CUST-00091
        - erp.sap
  - id: hub_product
    conceptual:
      name: Product Hub
      kind: hub
      description: Business key for all product entities.
    physical:
      name: hub_product
    display:
      icon: 📦
    columns:
      - id: product_hk
        name: Product Hash Key
        type: String
        isPrimaryKey: true
      - id: product_bk
        name: SKU (BK)
        type: String
      - id: load_dts
        name: Load Date
        type: Timestamp
      - id: record_source
        name: Record Source
        type: String
    sampleData: []
  - id: hub_order
    conceptual:
      name: Order Hub
      kind: hub
      description: Business key for all order transactions.
    physical:
      name: hub_order
    display:
      icon: 🧾
    columns:
      - id: order_hk
        name: Order Hash Key
        type: String
        isPrimaryKey: true
      - id: order_bk
        name: Order Number (BK)
        type: String
      - id: load_dts
        name: Load Date
        type: Timestamp
      - id: record_source
        name: Record Source
        type: String
    sampleData: []
  - id: lnk_order_line
    conceptual:
      name: Order Line
      kind: link
      description: Connects orders to products (one order can contain multiple products).
    physical:
      name: lnk_order_line
    columns:
      - id: lnk_hk
        name: Link Hash Key
        type: String
        isPrimaryKey: true
      - id: order_hk
        name: Order Hash Key
        type: String
        isForeignKey: true
      - id: customer_hk
        name: Customer Hash Key
        type: String
        isForeignKey: true
      - id: product_hk
        name: Product Hash Key
        type: String
        isForeignKey: true
      - id: load_dts
        name: Load Date
        type: Timestamp
      - id: record_source
        name: Record Source
        type: String
    sampleData: []
  - id: sat_customer_profile
    conceptual:
      name: Customer Profile
      kind: satellite
    physical:
      name: sat_customer_profile
    display:
      icon: 🛰️
    columns:
      - id: customer_hk
        name: Customer Hash Key
        type: String
        isForeignKey: true
      - id: load_dts
        name: Load Date
        type: Timestamp
        isPrimaryKey: true
      - id: hash_diff
        name: Hash Diff
        type: String
      - id: full_name
        name: Full Name
        type: String
      - id: email
        name: Email
        type: String
      - id: country_code
        name: Country Code
        type: String
      - id: segment
        name: Customer Segment
        type: String
    sampleData: []
  - id: sat_product_details
    conceptual:
      name: Product Details
      kind: satellite
    physical:
      name: sat_product_details
    display:
      icon: 🛰️
    columns:
      - id: product_hk
        name: Product Hash Key
        type: String
        isForeignKey: true
      - id: load_dts
        name: Load Date
        type: Timestamp
        isPrimaryKey: true
      - id: hash_diff
        name: Hash Diff
        type: String
      - id: product_name
        name: Product Name
        type: String
      - id: category
        name: Category
        type: String
      - id: brand
        name: Brand
        type: String
      - id: unit_cost
        name: Unit Cost
        type: Decimal
    sampleData: []
  - id: sat_order_header
    conceptual:
      name: Order Header
      kind: satellite
    physical:
      name: sat_order_header
    display:
      icon: 🛰️
    columns:
      - id: order_hk
        name: Order Hash Key
        type: String
        isForeignKey: true
      - id: load_dts
        name: Load Date
        type: Timestamp
        isPrimaryKey: true
      - id: hash_diff
        name: Hash Diff
        type: String
      - id: order_date
        name: Order Date
        type: Date
      - id: quantity
        name: Quantity
        type: Int
      - id: unit_price
        name: Unit Price
        type: Decimal
      - id: discount_amount
        name: Discount Amount
        type: Decimal
      - id: net_revenue
        name: Net Revenue
        type: Decimal
    sampleData: []
  - id: dim_customers
    conceptual:
      name: Customers
      kind: dimension
      description: SCD Type 2 customer dimension derived from hub_customer + sat_customer_profile.
    logical:
      name: Customer Dimension
      scd:
        type: type2
    physical:
      name: dim_customers
      strategy: table
    display:
      icon: 👤
    columns:
      - id: customer_key
        name: Customer Key
        type: Int
        isPrimaryKey: true
        additivity: fully
      - id: customer_id
        name: Customer ID (BK)
        type: String
      - id: full_name
        name: Full Name
        type: String
      - id: email
        name: Email
        type: String
      - id: country_code
        name: Country Code
        type: String
      - id: segment
        name: Customer Segment
        type: String
      - id: is_current
        name: Is Current
        type: Boolean
      - id: valid_from
        name: Valid From
        type: Date
      - id: valid_to
        name: Valid To
        type: Date
    metadata:
      tags:
        - WHO
    sampleData: []
  - id: dim_products
    conceptual:
      name: Products
      kind: dimension
      description: Product dimension derived from hub_product + sat_product_details.
    logical:
      name: Product Catalog
    physical:
      name: dim_products
      strategy: table
    display:
      icon: 📦
    columns:
      - id: product_key
        name: Product Key
        type: Int
        isPrimaryKey: true
      - id: product_id
        name: SKU (BK)
        type: String
      - id: product_name
        name: Product Name
        type: String
      - id: category
        name: Category
        type: String
      - id: brand
        name: Brand
        type: String
      - id: unit_cost
        name: Unit Cost
        type: Decimal
    metadata:
      tags:
        - WHAT
    sampleData: []
  - id: fct_orders
    conceptual:
      name: Orders
      kind: fact
      description: One row = one order line item. Built from hub_order + lnk_order_line + sat_order_header.
    logical:
      name: Order Transactions
    physical:
      name: fct_orders
      strategy: incremental
      update_mode: merge
      merge_key:
        - order_id
        - product_key
      partition:
        field: order_date
        granularity: day
    display:
      icon: 📊
    columns:
      - id: order_id
        name: Order ID
        type: String
        isPrimaryKey: true
      - id: customer_key
        name: Customer Key
        type: Int
        isForeignKey: true
      - id: product_key
        name: Product Key
        type: Int
        isForeignKey: true
      - id: date_key
        name: Date Key
        type: Int
        isForeignKey: true
      - id: order_date
        name: Order Date
        type: Date
        isPartitionKey: true
      - id: quantity
        name: Quantity
        type: Int
        additivity: fully
      - id: unit_price
        name: Unit Price
        type: Decimal
        additivity: non
      - id: net_revenue
        name: Net Revenue
        type: Decimal
        additivity: fully
    metadata:
      sla: 99%
      sql_path: fct_orders.sql
      tags:
        - WHAT
        - HOW_MUCH
    sampleData:
      - - ORD-1001
        - 42
        - 7
        - 20240115
        - 2
        - 29.99
        - 59.98
      - - ORD-1001
        - 42
        - 12
        - 20240115
        - 1
        - 149
        - 149
      - - ORD-1002
        - 18
        - 7
        - 20240116
        - 3
        - 29.99
        - 89.97
      - - ORD-1003
        - 91
        - 3
        - 20240116
        - 1
        - 499
        - 499
  - id: mart_daily_revenue
    conceptual:
      name: Daily Revenue
      kind: mart
      description: Daily revenue aggregated by category and region. Refreshed hourly.
    logical:
      name: Daily Revenue Summary
      grain:
        - date_key
        - category
        - country_code
    physical:
      name: mart_daily_revenue
      strategy: table
    display:
      icon: 📈
    columns:
      - id: date_key
        name: Date Key
        type: Int
        isPrimaryKey: true
      - id: category
        name: Category
        type: String
        isPrimaryKey: true
      - id: country_code
        name: Country Code
        type: String
        isPrimaryKey: true
      - id: gross_revenue
        name: Gross Revenue
        type: Decimal
        additivity: fully
      - id: order_count
        name: Order Count
        type: Int
        additivity: fully
      - id: units_sold
        name: Units Sold
        type: Int
        additivity: fully
    metadata:
      tags:
        - HOW_MUCH
        - WHEN
    sampleData: []
  - id: mart_product_performance
    conceptual:
      name: Product Performance
      kind: mart
      description: Monthly product ranking by revenue and units. Used for merchandising decisions.
    logical:
      grain:
        - month_key
        - product_key
    physical:
      name: mart_product_performance
      strategy: table
    display:
      icon: 🏆
    columns:
      - id: month_key
        name: Month Key
        type: Int
        isPrimaryKey: true
      - id: product_key
        name: Product Key
        type: Int
        isPrimaryKey: true
      - id: total_revenue
        name: Total Revenue
        type: Decimal
        additivity: fully
      - id: total_units
        name: Total Units
        type: Int
        additivity: fully
      - id: revenue_rank
        name: Revenue Rank
        type: Int
        additivity: non
    metadata:
      tags:
        - WHAT
        - HOW_MUCH
    sampleData: []
relationships:
  - from:
      table: lnk_order_line
      column:
        - order_hk
    to:
      table: hub_order
      column:
        - order_hk
    type: many-to-one
    id: rel-lnk_order_line.order_hk-hub_order.order_hk
  - from:
      table: lnk_order_line
      column:
        - customer_hk
    to:
      table: hub_customer
      column:
        - customer_hk
    type: many-to-one
    id: rel-lnk_order_line.customer_hk-hub_customer.customer_hk
  - from:
      table: lnk_order_line
      column:
        - product_hk
    to:
      table: hub_product
      column:
        - product_hk
    type: many-to-one
    id: rel-lnk_order_line.product_hk-hub_product.product_hk
  - from:
      table: sat_customer_profile
      column:
        - customer_hk
    to:
      table: hub_customer
      column:
        - customer_hk
    type: many-to-one
    id: rel-sat_customer_profile.customer_hk-hub_customer.customer_hk
  - from:
      table: sat_product_details
      column:
        - product_hk
    to:
      table: hub_product
      column:
        - product_hk
    type: many-to-one
    id: rel-sat_product_details.product_hk-hub_product.product_hk
  - from:
      table: sat_order_header
      column:
        - order_hk
    to:
      table: hub_order
      column:
        - order_hk
    type: many-to-one
    id: rel-sat_order_header.order_hk-hub_order.order_hk
  - from:
      table: fct_orders
      column:
        - customer_key
    to:
      table: dim_customers
      column:
        - customer_key
    type: many-to-one
    id: rel-fct_orders.customer_key-dim_customers.customer_key
  - from:
      table: fct_orders
      column:
        - product_key
    to:
      table: dim_products
      column:
        - product_key
    type: many-to-one
    id: rel-fct_orders.product_key-dim_products.product_key
  - from:
      table: fct_orders
      column:
        - date_key
    to:
      table: dim_dates
      column:
        - date_key
    type: many-to-one
    id: rel-fct_orders.date_key-dim_dates.date_key
lineage:
  - from: hub_customer
    to: dim_customers
    id: lin-hub_customer-dim_customers
  - from: sat_customer_profile
    to: dim_customers
    id: lin-sat_customer_profile-dim_customers
  - from: hub_product
    to: dim_products
    description: You can write description
    id: lin-hub_product-dim_products
  - from: sat_product_details
    to: dim_products
    id: lin-sat_product_details-dim_products
  - from: hub_order
    to: fct_orders
    id: lin-hub_order-fct_orders
  - from: lnk_order_line
    to: fct_orders
    id: lin-lnk_order_line-fct_orders
  - from: sat_order_header
    to: fct_orders
    id: lin-sat_order_header-fct_orders
  - from: dim_customers
    to: fct_orders
    id: lin-dim_customers-fct_orders
  - from: dim_products
    to: fct_orders
    id: lin-dim_products-fct_orders
  - from: dim_dates
    to: fct_orders
    id: lin-dim_dates-fct_orders
  - from: fct_orders
    to: mart_daily_revenue
    id: lin-fct_orders-mart_daily_revenue
  - from: fct_orders
    to: mart_product_performance
    id: lin-fct_orders-mart_product_performance
  - from: mart_daily_revenue
    to: sales_dashboard
    id: lin-mart_daily_revenue-sales_dashboard
  - from: mart_daily_revenue
    to: exec_report
    id: lin-mart_daily_revenue-exec_report
  - from: mart_product_performance
    to: exec_report
    id: lin-mart_product_performance-exec_report
domains:
  - id: raw_vault
    name: Raw Vault
    description: Immutable historical record loaded from source systems
    members:
      - hub_customer
      - hub_product
      - hub_order
      - lnk_order_line
      - sat_customer_profile
      - sat_product_details
      - sat_order_header
    display:
      color: rgba(234, 179, 8, 0.08)
  - id: star_schema
    name: Star Schema
    description: Conformed dimensional model built from the Raw Vault
    members:
      - dim_customers
      - dim_products
      - dim_dates
      - fct_orders
    display:
      color: rgba(59, 130, 246, 0.08)
  - id: mart
    name: Data Mart
    description: Aggregated models ready for BI consumption
    members:
      - mart_daily_revenue
      - mart_product_performance
    display:
      color: rgba(249, 115, 22, 0.08)
consumers:
  - id: sales_dashboard
    name: Sales Dashboard
    description: Real-time revenue and order metrics for the sales team
    url: https://bi.example.com/sales
    display:
      icon: 📊
      color: '#f97316'
  - id: exec_report
    name: Executive Report
    description: Weekly summary report delivered to leadership
    display:
      icon: 📋
      color: '#8b5cf6'
annotations:
  - id: note_vault_to_star
    text: |-
      Raw Vault → Star Schema
      Hub + Satellite = Dimension
      Hub + Link + Satellite = Fact
    offset:
      x: 20
      'y': -80
    target:
      id: raw_vault
      type: domain
    display:
      color: '#fef9c3'
  - id: note_grain
    text: |-
      Grain: order_id × product
      (one row per order line)
    offset:
      x: 300
      'y': 20
    target:
      id: fct_orders
      type: table
    display:
      color: '#7f7348'
  - id: note_import
    text: |-
      Imported from conformed-dims.yaml
      Edit the source to update.
    offset:
      x: 300
      'y': 0
    target:
      id: dim_dates
      type: table
    display:
      color: '#2a5498'
