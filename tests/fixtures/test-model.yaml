version: "2.0.0"
tables:
  - id: users
    conceptual:
      name: USERS
      kind: dimension
      description: System users
    columns:
      - id: id
        name: ID
        type: Integer
        isPrimaryKey: true
      - id: name
        name: Name
        type: String
    sampleData: []
  - id: orders
    conceptual:
      name: ORDERS
      kind: fact
      description: Customer orders
    columns:
      - id: id
        name: ID
        type: Integer
        isPrimaryKey: true
      - id: user_id
        name: User ID
        type: Integer
    sampleData: []
relationships:
  - id: rel_users_orders
    from:
      table: users
      column: [id]
    to:
      table: orders
      column: [user_id]
    type: one-to-many
domains:
  - id: core
    name: Core Domain
    members:
      - orders
      - users
annotations:
  - id: note_1
    text: Test Note
    offset:
      x: 1000
      'y': 1000
layout:
  users:
    x: 30
    'y': 30
  orders:
    x: 350
    'y': 30
