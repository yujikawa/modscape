    metrics:
      - name: Gross Revenue MTD
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: RUNNING_SUM(SUM([Gross Revenue]))
        description: Month-to-date gross revenue. Running total filtered to current month in Tableau.
      - name: Avg Order Value
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM([Net Revenue]) / COUNTD([Order ID])
        description: Average revenue per order. Excludes cancelled orders.
      - name: Units Sold
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM([Quantity])
        description: Total quantity of items sold in the selected period.
      - name: Revenue per Customer
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM([Net Revenue]) / COUNTD([Customer Key])
        description: Net revenue divided by number of unique paying customers.
      - name: Category Revenue Share
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM([Gross Revenue]) / TOTAL(SUM([Gross Revenue]))
        description: Revenue share of each category vs total. Tableau table calculation.
