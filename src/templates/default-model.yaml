# Modscape Data Model
# Use 'modscape dev <filename>' to visualize and edit this model.
version: "{{MODEL_FORMAT_VERSION}}"

domains:
  - id: sample_domain
    name: Sample Domain
    display:
      color: "rgba(59, 130, 246, 0.1)"
    description: "A logical grouping of related business entities."
    members: [source_table, derived_table]

tables:
  - id: source_table
    conceptual:
      name: Source Table
      kind: table
      description: "Raw source records."
    logical:
      name: "Original Business Record"
    physical:
      name: "raw_source_table"
    display:
      icon: "📋"
    columns:
      - id: id
        name: ID
        type: Int
        isPrimaryKey: true
        physical: { name: id, type: BIGINT }
      - id: name
        name: Name
        type: String
        physical: { name: name, type: VARCHAR(255) }
    sampleData:
      - [1, "Example Record A"]
      - [2, "Example Record B"]

  - id: derived_table
    conceptual:
      name: Derived Mart
      kind: mart
      description: "Processed analytics summary."
    logical:
      name: "Processed Analytics Summary"
    physical:
      name: "mart_derived_summary"
      strategy: incremental
    display:
      icon: "📈"
    columns:
      - id: id
        name: ID
        type: Int
        isPrimaryKey: true
        physical: { name: id, type: BIGINT }
      - id: source_id
        name: Source ID
        type: Int
        isForeignKey: true
        physical: { name: source_id, type: BIGINT }
      - id: summary_value
        name: Value
        type: Decimal
        additivity: fully
        physical: { name: total_val, type: NUMBER(18,2) }
    sampleData:
      - [101, 1, 150.50]
      - [102, 2, 300.75]

lineage:
  - id: lin-source_table-derived_table
    from: source_table
    to: derived_table

relationships:
  # Relationships: Defines Entity-Relationship connections (solid lines with 1:N badges)
  - id: rel_source_derived
    from: { table: source_table, column: [id] }
    to: { table: derived_table, column: [source_id] }
    type: one-to-many
